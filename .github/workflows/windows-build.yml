name: Build WebP Maker for Windows and Linux

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (64-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate WebP Maker files
        shell: pwsh
        run: |
          if (Test-Path 'package.json') { 'APP_DIR=.' >> $env:GITHUB_ENV }
          elseif (Test-Path 'WebP-Maker/package.json') { 'APP_DIR=WebP-Maker' >> $env:GITHUB_ENV }
          else { throw 'Could not find WebP Maker package.json.' }
      - name: Install and test
        shell: pwsh
        run: |
          Push-Location $env:APP_DIR
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'WebP Maker self-test failed' }
          Pop-Location
      - name: Build portable Windows app
        shell: pwsh
        run: |
          Push-Location $env:APP_DIR
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Pop-Location
      - name: Create Windows download ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:APP_DIR/release/WebP-Maker-win32-x64/*" -DestinationPath 'dist/WebP-Maker-Windows-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WebP-Maker-Windows-x64
          path: dist/WebP-Maker-Windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (64-bit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate WebP Maker files
        shell: bash
        run: |
          if [ -f package.json ]; then echo 'APP_DIR=.' >> "$GITHUB_ENV";
          elif [ -f WebP-Maker/package.json ]; then echo 'APP_DIR=WebP-Maker' >> "$GITHUB_ENV";
          else echo 'Could not find WebP Maker package.json.'; exit 1; fi
      - name: Install and test
        shell: bash
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run check
      - name: Bundle official portable ImageMagick for Linux
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          mkdir -p resources/webpmaker/linux
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34-gcc-x86_64.AppImage' \
            -o resources/webpmaker/linux/ImageMagick.AppImage
          echo '6e9edfd35d5f30b57c27533afe003d6085faaf8607b207426f398d11751acf93  resources/webpmaker/linux/ImageMagick.AppImage' | sha256sum -c -
          chmod +x resources/webpmaker/linux/ImageMagick.AppImage
          # Verify the FUSE-free extraction used by WebP Maker on Linux.
          scratch="$(mktemp -d)"
          cd "$scratch"
          "$GITHUB_WORKSPACE/$APP_DIR/resources/webpmaker/linux/ImageMagick.AppImage" --appimage-extract >/dev/null
          ./squashfs-root/AppRun -version
          rm -rf "$scratch"
      - name: Build portable Linux app
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run package:linux
          test -f release/WebP-Maker-linux-x64/WebP-Maker
          test -f release/WebP-Maker-linux-x64/resources/app/resources/webpmaker/linux/ImageMagick.AppImage
      - name: Create Linux download ZIP
        shell: bash
        run: |
          mkdir -p dist
          cd "$APP_DIR/release"
          zip -qry "$GITHUB_WORKSPACE/dist/WebP-Maker-Linux-x64.zip" WebP-Maker-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: WebP-Maker-Linux-x64
          path: dist/WebP-Maker-Linux-x64.zip
          if-no-files-found: error
