name: Build Juicy Chat Creator Tools v1.1.0 (Windows and Linux)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows (64-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fixed version and combined entrypoint
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');if(p.version!=='1.1.0'||!fs.readFileSync('main.js','utf8').includes('createIntroService'))process.exit(1);console.log('PASS: v1.1.0 combined entrypoint')"
      - name: Install and run source regression tests (REQUIRED)
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Bundle verified portable ImageMagick (REQUIRED)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bundle-imagemagick.js win32
          if (!(Test-Path 'resources/webpmaker/windows/magick.exe')) { throw 'ImageMagick missing' }
      - name: Build renamed Windows application
        shell: pwsh
        run: |
          npx @electron/packager . "Juicy Chat Creator Tools" --platform=win32 --arch=x64 --out=dist --overwrite --prune=true --executable-name="JuicyChat Creator Tool" --icon=assets/icon.ico
          $exe='dist/Juicy Chat Creator Tools-win32-x64/JuicyChat Creator Tool.exe'
          if (!(Test-Path $exe)) { throw 'Windows executable is missing.' }
          if (!(Test-Path 'dist/Juicy Chat Creator Tools-win32-x64/resources/app/introduction-designer/layout.js')) { throw 'Introduction snapping engine was not packaged.' }
      - name: TEST actual Windows app - MP4 to WebP (REQUIRED)
        shell: pwsh
        run: |
          $env:CREATOR_TOOLS_E2E_REPORT = Join-Path $env:RUNNER_TEMP 'creator-tools-win-e2e.json'
          $env:JBS_WEBP_MAGICK = ''
          $exe=(Resolve-Path 'dist/Juicy Chat Creator Tools-win32-x64/JuicyChat Creator Tool.exe').Path
          $proc=Start-Process -FilePath $exe -ArgumentList '--creator-tools-e2e' -PassThru
          if (-not $proc.WaitForExit(420000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'Windows end-to-end conversion exceeded 7 minutes.'
          }
          if (!(Test-Path $env:CREATOR_TOOLS_E2E_REPORT)) { throw "App wrote no test report (exit $($proc.ExitCode))." }
          $report=Get-Content $env:CREATOR_TOOLS_E2E_REPORT -Raw | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or -not $report.ok) { throw (Get-Content $env:CREATOR_TOOLS_E2E_REPORT -Raw) }
          if ($report.bytes -gt 9990000 -or $report.frames -lt 30 -or $report.width -ne 480 -or $report.height -ne 640) { throw 'Invalid WebP result.' }
          Write-Host "PASS: Windows packaged app $($report.frames) frames; moving frames by clip $($report.unique)."
      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Juicy Chat Creator Tools-win32-x64/*' -DestinationPath 'WebP-Maker-Windows-x64.zip' -Force
          if (!(Test-Path 'WebP-Maker-Windows-x64.zip')) { throw 'Windows release ZIP missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Juicy-Chat-Creator-Tools-Windows-x64
          path: WebP-Maker-Windows-x64.zip
          if-no-files-found: error
  linux:
    name: Linux (64-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check fixed version and combined entrypoint
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');if(p.version!=='1.1.0'||!fs.readFileSync('main.js','utf8').includes('createIntroService'))process.exit(1);console.log('PASS: v1.1.0 combined entrypoint')"
      - name: Install and run source regression tests (REQUIRED)
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Bundle verified ImageMagick AppImage (REQUIRED)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bundle-imagemagick.js linux
          test -x resources/webpmaker/linux/magick
      - name: Build renamed Linux application
        run: |
          npx @electron/packager . 'Juicy Chat Creator Tools' --platform=linux --arch=x64 --out=dist --overwrite --prune=true --executable-name="JuicyChat Creator Tool" --icon=assets/icon.png
          test -f 'dist/Juicy Chat Creator Tools-linux-x64/JuicyChat Creator Tool'
          test -f 'dist/Juicy Chat Creator Tools-linux-x64/resources/app/introduction-designer/layout.js'
          chmod +x 'dist/Juicy Chat Creator Tools-linux-x64/JuicyChat Creator Tool'
          chmod +x 'dist/Juicy Chat Creator Tools-linux-x64/resources/app/resources/webpmaker/linux/magick'
      - name: TEST actual Linux app - MP4 to WebP (REQUIRED)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          export CREATOR_TOOLS_E2E_REPORT="$RUNNER_TEMP/creator-tools-linux-e2e.json"
          unset JBS_WEBP_MAGICK || true
          timeout 420s xvfb-run -a --server-args='-screen 0 1600x900x24' \
            'dist/Juicy Chat Creator Tools-linux-x64/JuicyChat Creator Tool' --no-sandbox --disable-gpu --creator-tools-e2e
          test -s "$CREATOR_TOOLS_E2E_REPORT"
          node -e 'const r=require(process.env.CREATOR_TOOLS_E2E_REPORT); if(!r.ok||r.bytes>9990000||r.frames<30||r.width!==480||r.height!==640)process.exit(1); console.log("PASS: Linux packaged app",r.frames,"frames; moving frames by clip",r.unique)'
      - name: Create Linux portable ZIP
        run: |
          cd 'dist/Juicy Chat Creator Tools-linux-x64'
          zip -qr ../../WebP-Maker-Linux-x64.zip .
          test -s ../../WebP-Maker-Linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Juicy-Chat-Creator-Tools-Linux-x64
          path: WebP-Maker-Linux-x64.zip
          if-no-files-found: error
